name: Build and publish mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish XP Skill Tree
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew clean build --no-daemon

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected exactly one distributable JAR, found %s\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'Artifact: %s\n' "${jars[0]}"
          sha256sum "${jars[0]}"

      - name: Publish to CurseForge and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: '1635528'
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/*.jar
          name: XP Skill Tree ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: forge
          game-versions: 1.18.2
          java: 17
          type: mod
          github-generate-changelog: true
          github-prerelease: false
